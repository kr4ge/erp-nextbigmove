version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_analytics
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - erp-network

  minio:
    image: minio/minio:latest
    container_name: erp-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Optional: audio transcription for creative analysis. Start it with
  # `docker compose -f docker-compose.dev.yml --profile ai up -d whisper` and
  # point the API at it with CREATIVE_AI_WHISPER_URL=http://127.0.0.1:3110.
  whisper:
    build:
      context: .
      dockerfile: apps/whisper/Dockerfile
      args:
        WHISPER_MODEL: ${CREATIVE_AI_WHISPER_MODEL:-small}
    container_name: erp-whisper
    profiles: ["ai"]
    environment:
      WHISPER_MODEL: ${CREATIVE_AI_WHISPER_MODEL:-small}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      WHISPER_IDLE_UNLOAD_SECONDS: 0
    ports:
      - "3110:3110"
    networks:
      - erp-network

volumes:
  postgres_data:
  postgres_data_v18:
  redis_data:
  minio_data:

networks:
  erp-network:
    driver: bridge
